name: Outlier finder

on:
  schedule:
    - cron: "37 1 * * *"    # daily   07:07 IST - hunt, validate, analyze approved, remix picked, email
    - cron: "13 3 * * 0"    # Sunday  08:43 IST - weekly pattern review (+ discovery until the list is full)
    - cron: "47 3 1 * *"    # 1st     09:17 IST - monthly baseline refresh, pruning, new accounts, report
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        required: true
        default: daily
        type: choice
        options: [init, check, discover, daily, weekly, monthly]
      username:
        description: "Instagram handle used by `check`"
        required: false
        default: garyvee

concurrency:
  group: outlier
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pick job
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_JOB: ${{ inputs.job }}
        run: |
          case "$SCHEDULE" in
            "13 3 * * 0") JOB=weekly ;;
            "47 3 1 * *") JOB=monthly ;;
            "37 1 * * *") JOB=daily ;;
            *) JOB="${INPUT_JOB:-daily}" ;;
          esac
          echo "job=$JOB" >> "$GITHUB_OUTPUT"

      - name: Run ${{ steps.pick.outputs.job }}
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          USERNAME: ${{ inputs.username || 'garyvee' }}
        run: python -m outlier "${{ steps.pick.outputs.job }}" --username "$USERNAME"
